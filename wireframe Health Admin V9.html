:root {
  color-scheme: light;
  --bg:#f3f6fa; --surface:#fff; --ink:#172d46; --muted:#52657b;
  --line:#e2e9f1; --soft:#f7f9fc; --navy:#11263e; --navy-deep:#102239;
  --teal:#087d70; --teal-text:#056b61; --teal-bright:#50dbbe; --teal-soft:#e8f7f3;
  --blue:#345cba; --blue-soft:#edf2ff; --gold:#93570b; --gold-soft:#fff3de;
  --rose:#a23c59; --rose-soft:#fbeef2; --violet:#6650a4; --violet-soft:#f1edfc;
  --shadow:0 2px 4px #192f4a05; --radius:14px;
  font:14px/1.65 "Vazirmatn","Panel Arabic",Tahoma,Arial,sans-serif;
}
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--ink); min-width:320px }
button,input,select,textarea { font:inherit }
button,a,input,select,textarea,summary { -webkit-tap-highlight-color:transparent }
button { cursor:pointer }
a { color:inherit; text-decoration:none }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible { outline:2px solid #168f82; outline-offset:3px }
button:disabled { cursor:default; opacity:.5 }
[hidden] { display:none !important }
h1,h2,h3,p { margin:0 }
small { font-size:12px }
.icon { width:20px; height:20px; display:inline-block; vertical-align:middle; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round }
.skip { position:fixed; z-index:50; inset-block-start:8px; inset-inline-start:10px; transform:translateY(-150%); background:#fff; padding:8px 16px; border-radius:8px }
.skip:focus-visible { transform:none }
.shell { --side:257px; display:grid; grid-template-columns:var(--side) minmax(0,1fr); min-height:100vh }
.sidebar { color:#c6d2e0; background:var(--navy); position:sticky; top:0; height:100dvh; display:flex; flex-direction:column; overflow:auto; scrollbar-color:#486077 transparent; z-index:20 }
.brand { display:flex; align-items:center; gap:12px; padding:24px 19px 21px; border-bottom:1px solid #ffffff15; color:#fff }
.brand-icon { display:grid; place-items:center; width:43px; height:43px; border-radius:12px; background:#43d8b8; color:#16364a }
.brand-icon .icon { width:26px; height:26px; stroke-width:2 }
.brand strong { display:block; font-size:17px; line-height:1.45 }
.brand span span { display:block; color:#b3c4d7; font-size:11px; letter-spacing:.08em; font-family:Arial,sans-serif; margin-top:3px }
.navigation { padding:17px 12px 14px }
.nav-group { margin-block-end:18px }
.nav-heading { font-size:12px; color:#a4b6ca; padding:0 11px; margin-block-end:5px; display:block }
.nav-item { position:relative; display:flex; align-items:center; gap:10px; min-height:39px; padding:7px 11px; border-radius:8px; color:#d4dfea; line-height:1.5; font-size:13px; margin-block:2px }
.nav-item .icon { width:17px; height:17px; color:#a6bacd }
.nav-item:hover { background:#ffffff13; color:white }
.nav-item.active { color:#c9fff2; font-weight:700; background:#1c4554 }
.nav-item.active::before { content:""; position:absolute; inset-inline-start:0; top:8px; bottom:8px; width:3px; background:var(--teal-bright); border-radius:6px }
.nav-item.active .icon { color:var(--teal-bright) }
.sidebar-foot { display:flex; align-items:center; gap:10px; padding:14px 19px 18px; margin-block-start:auto; border-top:1px solid #ffffff15; color:#b6c7da; font-size:12px }
.sidebar-foot .icon { color:var(--teal-bright); width:16px; height:16px }
.workspace { min-width:0 }
.main:focus { outline:none }
.topbar { height:71px; background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 30px; gap:15px; position:sticky; top:0; z-index:10 }
.top-start,.top-actions,.crumbs { display:flex; align-items:center; gap:10px; min-width:0 }
.crumbs { color:var(--muted); font-size:13px; gap:8px }
.crumbs .current { color:var(--ink); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.crumbs .icon { width:14px; height:14px }
.crumbs .home .icon { width:17px; height:17px }
.global-search { width:220px; min-width:145px; justify-content:flex-start!important; background:var(--soft)!important; color:var(--muted)!important }
.global-search kbd { margin-inline-start:auto; font:11px Arial,sans-serif; padding:3px 5px; border-radius:4px; border:1px solid var(--line); background:white; direction:ltr }
.avatar { width:37px; height:37px; display:grid; place-items:center; border-radius:50%; background:#def3ef; color:#086456; font-weight:700; flex:none }
.profile { display:flex; align-items:center; gap:9px; background:none; border:0; border-inline-start:1px solid var(--line); padding:0 10px 0 0; color:var(--ink); text-align:start }
.profile strong,.profile small { display:block; line-height:1.4; white-space:nowrap }
.profile small { color:var(--muted); margin-top:2px }
.profile .icon { width:15px; height:15px }
.top-icon { position:relative; width:39px; height:39px; padding:0!important }
.unread { position:absolute; top:7px; right:8px; width:8px; height:8px; border:2px solid white; border-radius:50%; background:var(--teal) }
.menu-toggle,.scrim { display:none!important }
.main { max-width:1700px; margin:0 auto; padding:26px 30px 38px }
.page-head { display:flex; justify-content:space-between; align-items:flex-end; gap:18px; margin-bottom:22px }
.page-head h1 { font-size:29px; font-weight:700; line-height:1.45; letter-spacing:-.035em }
.page-head p { color:var(--muted); margin-top:5px }
.head-buttons,.inline-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center }
.button { display:inline-flex; justify-content:center; align-items:center; gap:7px; min-height:39px; padding:6px 12px; border-radius:9px; border:1px solid var(--line); color:var(--ink); background:#fff; font-weight:700; white-space:nowrap; text-align:center }
.button .icon { width:17px; height:17px }
.button:hover:not(:disabled) { background:#eff5fa; border-color:#cbd9e5 }
.button.primary { background:var(--teal); color:white; border-color:var(--teal) }
.button.primary:hover { background:#06695e; border-color:#06695e }
.button.warning { background:#a23c59; border-color:#a23c59; color:#fff }
.button.warning:hover { background:#862e46; border-color:#862e46 }
.button.text { background:transparent; border-color:transparent; color:var(--teal-text); padding-inline:6px }
.button.text:hover { background:var(--teal-soft); border-color:transparent }
.button.current { color:var(--teal-text); background:var(--teal-soft); border-color:#b8e4d9 }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); min-width:0 }
.hero { display:flex; justify-content:space-between; align-items:center; gap:20px; position:relative; overflow:hidden; background:linear-gradient(112deg,#153549,#103743 52%,#133448); color:white; border:1px solid #204457; border-radius:var(--radius); padding:19px 22px; margin-bottom:20px; isolation:isolate }
.hero::after { content:""; position:absolute; z-index:-1; inset-inline-end:10%; width:210px; height:120px; top:-26px; background:radial-gradient(circle,#52d8b4 1px,transparent 1.5px) 0 0/11px 11px; opacity:.19; mask-image:linear-gradient(90deg,transparent,#000 35%,#000 60%,transparent) }
.hero-summary { display:flex; align-items:center; min-width:0; gap:12px }
.hero-summary .tile { color:#8cf4db; background:#ffffff16 }
.hero h2 { font-size:15px; line-height:1.55 }
.hero p { color:#cadfe6; margin-top:3px; font-size:13px }
.hero-date { display:flex; align-items:center; gap:7px; white-space:nowrap; color:#e2f4f4; font-size:13px }
.hero-date .icon { width:16px; height:16px; color:#84e9d3 }
.kpis { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px; margin-bottom:20px }
.kpi { display:flex; align-items:flex-start; gap:12px; padding:15px; min-height:97px; transition:border-color .15s,background .15s }
.kpi:hover { border-color:#a9dacf; background:#fcfffe }
.tile { width:41px; height:41px; border-radius:10px; background:var(--teal-soft); color:var(--teal-text); display:grid; place-items:center; flex:none }
.tile .icon { width:21px; height:21px }
.tile.blue { background:var(--blue-soft); color:var(--blue) }
.tile.gold { background:var(--gold-soft); color:var(--gold) }
.tile.rose { background:var(--rose-soft); color:var(--rose) }
.tile.violet { background:var(--violet-soft); color:var(--violet) }
.kpi-label { color:var(--muted); font-size:13px; display:block; margin-bottom:3px }
.kpi strong { font-size:23px; line-height:1.3; display:inline-block; font-variant-numeric:tabular-nums }
.kpi small { color:var(--muted); margin-inline-start:4px; white-space:nowrap }
.dashboard-grid { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(295px,1fr); gap:16px; margin-bottom:16px }
.section-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:17px 18px 13px }
.section-head h2 { font-size:16px }
.section-head p { margin-top:2px; color:var(--muted); font-size:12px }
.section-head .select { min-height:34px; font-size:12px; width:auto }
.chart { margin:0 12px 12px; min-height:198px; display:grid; align-items:center }
.chart svg { width:100%; max-height:270px; display:block; overflow:visible }
.chart text { fill:var(--muted); font-size:13px }
.chart .grid-line { stroke:#e4ebf1; stroke-dasharray:4 4 }
.chart .plot-point { fill:white; stroke:#0d8c7e; stroke-width:2.5 }
.donut-wrap { display:grid; grid-template-columns:122px minmax(0,1fr); align-items:center; gap:14px; padding:7px 17px 18px }
.donut { border-radius:50%; width:120px; height:120px; position:relative; display:grid; place-items:center }
.donut::before { content:""; background:white; border-radius:50%; width:91px; height:91px; position:absolute }
.donut div { position:relative; text-align:center; line-height:1.4 }
.donut strong,.donut small { display:block }
.donut strong { font-size:23px }
.donut small { color:var(--muted) }
.legend { display:grid; gap:8px; font-size:12px }
.legend a { display:grid; grid-template-columns:9px 1fr auto; align-items:center; gap:7px }
.legend a:hover,.record-link:hover,.crumbs a:hover { text-decoration:underline }
.legend i,.legend-dot { width:8px; height:8px; border-radius:50%; display:inline-block }
.activity { display:grid; gap:10px; padding:2px 18px 15px }
.activity a { display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); padding:0 0 9px }
.activity a:last-child { border:0; padding-bottom:0 }
.activity a:hover strong { color:var(--teal-text) }
.activity a .tile { width:32px; height:32px; border-radius:8px }
.activity a .tile .icon { width:16px; height:16px }
.activity a strong { font-size:13px; display:block }
.activity a small { color:var(--muted); display:block }
.activity time { margin-inline-start:auto; white-space:nowrap; color:var(--muted); font-size:12px }

function centerSampleRandom(id) {
  let state=[...id].reduce((hash,character)=>Math.imul(hash^character.charCodeAt(0),16777619),2166136261);
  return limit=>{
    state=(Math.imul(state,1664525)+1013904223)>>>0;
    return Math.floor(state/4294967296*limit);
  };
}
function sampleUniqueId(random,used,min,max) {
  let number;
  do {
    number=String(min+random(max-min+1));
  } while(used.has(number));
  used.add(number);
  return number;
}
function fillCenterDirectory(data) {
  if(data.hasCenterDirectory) return data;
  const usedCenters=new Set(data.centers.map(center=>center.companyId).filter(Boolean));
  const usedBranches=new Set(data.centers.flatMap(center=>(center.branches||[]).map(branch=>branch.id)).filter(Boolean));
  const settlementPlans=new Map(data.plans.filter(isSettlementPlan).map(plan=>[plan.centerId,plan]));
  const contractPlanOptions=contractOptions(data.paymentTiers);
  for(const center of data.centers){
    const random=centerSampleRandom(center.id);
    const plan=settlementPlans.get(center.id);
    const pickPlan=(options=contractPlanOptions)=>options[random(options.length)][0];
    const pickInsurers=()=>{
      const options=[...centerInsurers];
      return Array.from({length:1+random(4)},()=>options.splice(random(options.length),1)[0]);
    };
    center.companyId||=sampleUniqueId(random,usedCenters,50000000,99999999);
    center.personType='حقیقی';
    center.status||='active';
    center.contractPlan??=center.healthContract==='no'?'none':
      plan?(settlementResult(plan.months,plan.discountPoints,data.paymentTiers).matchedTier?.name||'none'):pickPlan(
        center.healthContract==='yes'?contractPlanOptions.slice(0,-1):contractPlanOptions
      );
    center.insurers=pickInsurers();
    if(!center.branches?.length) {
      center.branches=Array.from({length:1+random(3)},(_,index)=>({
        name:`${center.name} · شعبه ${index+1}`,
        address:[center.city,'نشانی نمونه شعبه '+(index+1)].filter(Boolean).join('، ')
      }));
    }
    for(const branch of center.branches){
      branch.id||=sampleUniqueId(random,usedBranches,6000000,9999999);
      branch.code||=branch.id;
      branch.status||=random(5)===0?'inactive':'active';
      branch.contractPlan??=pickPlan();
      branch.insurers??=pickInsurers();
    }
  }
  data.hasCenterDirectory=true;
  return data;
}

function settlementResult(months,discountPoints,tiers=db.paymentTiers) {
  const timeCost=months*monthlySettlementRate;
  const totalBenefit=timeCost+discountPoints;
  const matchedTier=tiers.filter(item=>item.threshold<=totalBenefit)
    .reduce((best,item)=>!best||item.threshold>best.threshold?item:best,null);
  return {timeCost,totalBenefit,tier:matchedTier?.name||'بدون طرح',matchedTier};
}
function isSettlementPlan(row) {
  return Number.isInteger(row.months);
}
function addSettlementTerms(data) {
  if(data.hasSettlementTerms) return data;
  for(const [index,[name,type,months,discountPoints]] of centerSettlementTerms.entries()){
    const centerId=`CTR-P-${pad(index+1)}`;
    data.centers.push({id:centerId,name,type});
    data.plans.push({id:`PLN-C-${pad(index+1)}`,centerId,months,discountPoints,status:'active'});
  }
  data.hasSettlementTerms=true;
  return data;
}

function isCreditTemplate(row) {
  return Array.isArray(row.durations);
}
function updateFinanceData(data) {
  addSettlementTerms(data);
  if(data.hasFinanceRevision) return data;
  for(const [index,tier] of settlementTiers.entries()){
    data.templates.push({
      id:`TPL-T-${pad(index+1)}`,name:tier.name,...creditTemplateTerms[index],
      settlementRate:5500,financingCost:4500,durations:times(12,i=>i+1)
    });
  }
  for(const [index,subscription] of data.subscriptions.entries()){
    if(!/^SUB-10(?:0[1-9]|1[0-5])$/.test(subscription.id)) continue;
    const owners=data.users.filter(user=>user.id!==subscription.userId);
    subscription.ownerId=owners.length?at(owners,index+14).id:'';
    subscription.relationship=at(familyRelationships,index);
  }
  for(const [index,claim] of data.claims.entries()){
    if(['بیمه نمونه الف','بیمه نمونه ب'].includes(claim.insurer)) claim.insurer=at(demoInsurers,index);
  }
  const casesWithRepayment=new Set(data.invoices.filter(invoice=>invoice.paid>0).map(invoice=>invoice.caseId));
  for(const row of data.credit){
    if(row.history[0]?.text==='تشکیل پرونده توسط مرکز درمانی') row.history[0].text='ثبت درخواست اعتبار توسط کاربر';
    if(['created','pending'].includes(row.status)) row.status='requested';
    else if(row.status==='completed') row.status='paid';
    else if(row.status==='approved') row.status=casesWithRepayment.has(row.id)?'paid':'blocked';
  }
  data.hasFinanceRevision=true;
  return data;
}
function creditCaseStatus(status) {
  if(['paid','completed','consumed'].includes(status)) return 'consumed';
  if(['approved','blocked'].includes(status)) return 'blocked';
  return 'inquiry';
}
function updateCreditCaseData(data) {
  if(data.hasCreditCaseRevision) return data;
  const legacyPlans=new Map(data.plans.map(plan=>[plan.id,plan]));
  const legacyTemplates=data.templates.filter(template=>!isCreditTemplate(template));
  const tiersByTemplate=new Map(legacyTemplates.map((template,index)=>[template.id,at(creditRepaymentTierIds,index)]));
  for(const row of data.credit) {
    row.repaymentTierId??=tiersByTemplate.get(legacyPlans.get(row.planId)?.templateId)||creditRepaymentTierIds[0];
    row.status=creditCaseStatus(row.status);
    for(const entry of row.history){
      if(entry.status&&!['rejected','canceled'].includes(entry.status)) entry.status=creditCaseStatus(entry.status);
    }
  }
  data.hasCreditCaseRevision=true;
  return data;
}
function caseBlocked(row) {
  return row.status==='blocked'?row.approved:0;
}
function caseDisbursed(row) {
  return row.status==='consumed'?row.approved:0;
}
function dueDate(date,offset) {
  const [startYear,startMonth,day]=date.split('/').map(Number);
  const position=startMonth-1+offset;
  const year=startYear+Math.floor(position/12);
  const month=position%12+1;
  const lastDay=month<=6?31:month<12?30:persianYearLength(year)-336;
  return `${year}/${pad(month)}/${pad(Math.min(day,lastDay))}`;
}
function invoiceInstallments(invoice,count) {
  const amount=Math.floor(invoice.total/count);
  let remainingPaid=invoice.paid;
  return times(count,index=>{
    const principal=index===count-1?invoice.total-amount*index:amount;
    const paid=Math.min(remainingPaid,principal);
    remainingPaid-=paid;
    return {
      number:index+1,date:dueDate(invoice.date,index+1),principal,paid,remaining:principal-paid,
      status:paid===principal?'paid':paid>0?'partial':'unpaid'
    };
  });
}

function seed() {
  const data = {};
  data.centers = centerSeeds.map(([name,type,province,city],i)=>({
    id:recordId('centers',i),name,type,province,city,phone:`000000${String(1200+i)}`,manager:at(names,i+12),
    managerPhone:`0900000${200+i}`,address:`خیابان نمونه، کوچه سلامت، پلاک ${i+10}`,locationNote:'نزدیک ایستگاه مرکزی',
    contract:`CTR-S-${i+501}`,contractDate:dateAt(1,i+2),contractNote:'پرونده قراردادی نمونه',
    status:i===7||i===10?'inactive':'active',date:dateAt(1+(i%4),i+3)
  }));
  data.templates = times(8,i=>({
    id:recordId('templates',i),name:at(['اقساط پایه','اعتبار ویژه درمان','درمان کوتاه‌مدت','بازپرداخت منعطف',
       'بسته دندان‌پزشکی','پوشش خدمات تشخیصی','طرح سازمانی','بسته جراحی'],i),
    type:at(planTypes,i),min:1000000*(i+2),max:10000000*(i+10),installments:at([3,6,4,9,12],i),
    status:i===6?'inactive':'active',date:dateAt(2,i+8),terms:'شرایط پرداخت نمونه، قابل بازنگری'
  }));
  data.plans = times(15,i=>{
    const template=at(data.templates,i);
    return {
      id:recordId('plans',i),name:`${at(['پرداخت پایه','اقساط درمان','بازپرداخت منعطف','پوشش درمان'],i)} ${100+i}`,
      centerId:at(data.centers,i).id,templateId:template.id,type:template.type,min:template.min,max:template.max,
      installments:template.installments,start:dateAt(3,i+1),end:'1406/03/30',
      status:i===6||i===13?'inactive':'active',terms:'شرایط نمونه ویژه مرکز درمانی',date:dateAt(2,i+8)
    };
  });
  const serviceSeeds = {
    'بیمارستان':[['نوبت ویزیت تخصصی',0,'حضوری'],['مشاوره پیش از جراحی',1,'آنلاین']],
    'کلینیک':[['ویزیت پزشک عمومی',0,'حضوری'],['ویزیت پیگیری درمان',2,'آنلاین']],
    'آزمایشگاه':[['آزمایش خون',3,'حضوری'],['چکاپ سلامت',3,'حضوری']],
    'مرکز تصویربرداری':[['سونوگرافی',4,'حضوری'],['تصویربرداری دیجیتال',4,'حضوری']],
    'مرکز دندان‌پزشکی':[['جرم‌گیری دندان',5,'حضوری'],['نوبت معاینه دندان',0,'حضوری']]
  };
  data.services = times(20,i=>{
    const selected=at(data.centers,i);
    const [name,type,method]=serviceSeeds[selected.type][i<data.centers.length?0:1];
    return {id:recordId('services',i),name,type:serviceTypes[type],centerId:selected.id,method,
      status:i%7===0?'inactive':'active',description:'خدمت نمونه قابل ارائه توسط مرکز'};
  });
  data.rankings = data.centers.map((item,i)=>{
    const fields={quality:at([4.9,4.6,4.1,4.7,4.3,4.8],i),response:at([4.8,4.6,4.7,4.1,4.3],i),access:at([4.6,4.2,4.4,4.7],i)};
    return {id:recordId('rankings',i),centerId:item.id,status:'active',
      evaluations:times(2+i%4,j=>({...fields,date:dateAt(5+j,Math.min(26,5+i+j)),description:'ارزیابی نمونه تیم عملیات'}))};
  });
  data.users = names.map((name,i)=>({
    id:recordId('users',i),name,national:`0000000${300+i}`,phone:`0900000${500+i}`,
    date:dateAt(1+(i%2),i%26+1),status:i%13===0?'limited':i===10?'inactive':'active'
  }));
  data.subscriptions = times(15,i=>({
    id:recordId('subscriptions',i),userId:at(data.users,i).id,type:at(subscriptionTypes,i),
    limit:100000000+(i%5)*20000000,start:dateAt(3,1),end:'1406/03/30',status:i%8===0?'inactive':'active',
    terms:'تمدید و تخصیص اعتبار بر اساس سیاست نمونه در وایرفریم'
  }));
  const months=[3,4,5,6,7,8,3,4,5,6,7,8,4,5,6,7,8,7,8,8];
  data.credit = times(20,i=>{
    const plan=at(data.plans,i);
    const user=at(data.users,i);
    const state=at(['completed','created','approved','pending','rejected','completed','canceled',
      'approved','pending','completed','approved','pending','approved','approved','completed','pending',
      'approved','completed','approved','pending'],i);
    const requested=Math.max(plan.min,4500000+i*1450000);
    const date=dateAt(months[i],Math.min(27,5+i));
    const history=[log(date,'تشکیل پرونده توسط مرکز درمانی','created')];
    if(state!=='created') history.push(log(date,'ارسال درخواست برای انتخاب و تأیید شرایط بازپرداخت','pending'));
    if(['rejected','canceled','approved','completed'].includes(state)) {
      const status=state==='completed'?'approved':state;
      history.push(log(date,status==='approved'?'تأیید شرایط بازپرداخت و اعتبار درخواستی':statuses[status][0],status));
    }
    if(state==='completed') history.push(log(date,'تکمیل پرونده اعتباری','completed'));
    return {id:recordId('credit',i),userId:user.id,centerId:plan.centerId,planId:plan.id,
      subscriptionId:at(data.subscriptions,i)?.userId===user.id?at(data.subscriptions,i).id:'',
      serviceAmount:requested+2500000,requested,approved:['approved','completed'].includes(state)?requested:0,
      installments:plan.installments,date,status:state,history,
      changes:[log(date,'ایجاد پرونده و ثبت مبلغ خدمت')]};
  });
  const eligible=data.credit.filter(row=>row.approved>0);
  data.invoices = times(20,i=>{
    const credit=at(eligible,i);
    const partCount=Math.floor((19-i%eligible.length)/eligible.length)+1;
    const base=Math.floor(credit.approved/partCount);
    const total=i+eligible.length>=20?credit.approved-base*(partCount-1):base;
    const paid=i===0||i%4===1?0:i%4===2?Math.round(total*.55):total;
    const service=data.services.find(item=>item.centerId===credit.centerId&&item.status==='active')?.name;
    return {id:recordId('invoices',i),caseId:credit.id,total,paid,date:credit.date,
      paymentRef:paid>0?`PAY-${6051+i}`:'',paymentMethod:paid>0?'پرداخت اعتباری نمونه':'',
      items:[{name:service||'خدمت درمانی',amount:Math.round(total*.88)},{name:'خدمات جانبی',amount:total-Math.round(total*.88)}]};
  });
  data.claims = times(15,i=>{
    const date=dateAt(6+i%3,9+i);
    const status=at(['inReview','needsDocs','approved','paid','registered','inReview','rejected'],i);
    const requested=1800000+i*800000;
    const approved=['approved','paid'].includes(status)?Math.floor(requested*.8):0;
    return {
      id:recordId('claims',i),userId:at(data.users,i+8).id,policy:`POL-${i+4901}`,type:at(claimTypes,i),
      insurer:at(['بیمه نمونه الف','بیمه نمونه ب'],i),requested,approved,date,status,
      assessment:status==='needsDocs'?'در انتظار تکمیل مستندات':status==='rejected'?'هزینه خارج از تعهد نمونه':
        approved?'تأیید پس از بررسی مستندات':'ارزیابی در جریان است',
      documents:['صورت‌حساب مرکز درمانی','مدرک خدمت درمانی'],
      history:status==='registered'?[log(date,'ثبت درخواست خسارت','registered')]:
        [log(date,'ثبت درخواست خسارت','registered'),log(date,'به‌روزرسانی نتیجه رسیدگی',status)]
    };
  });
  data.roles = ['مدیر ارشد','کارشناس عملیات مراکز','کارشناس مالی','کارشناس خسارت','کارشناس پشتیبانی'].map((name,i)=>({
    id:recordId('roles',i),name,description:at(['مدیریت کل پنل','مدیریت اطلاعات و خدمات مراکز','پیگیری امور مالی و اعتباری',
      'بررسی پرونده‌های خسارت','مشاهده اطلاعات و پاسخ‌گویی'],i),status:'active',
    permissions:Object.fromEntries(permissionRows.map((key,j)=>[key,i===0?Object.keys(permissionActions):
      j===0?['view']:(([['centers','plans','services','rankings'],['invoices','credit','subscriptions','templates'],
        ['claims'],['users','credit']][i-1]).includes(key)?(i===4?['view']:['view','edit','approve']):[])]))
  }));
  data.admins = ['مهسا رادپور','پارسا حق‌شناس','ناهید آریامنش','مانی کیان‌پور','مهرنوش جهان‌مهر','سام نیک‌پی','آناهیتا مهرورز','امیرعلی نامور'].map((name,i)=>({
    id:recordId('admins',i),name,username:`health.admin${i+1}`,phone:`0900000${701+i}`,roleId:at(data.roles,i).id,
    unit:at(units,i),login:dateAt(8,30-i),status:i===7?'inactive':'active'
  }));
  data.activities=[
    {module:'credit',id:data.credit[19].id,text:'درخواست استفاده از اعتبار',date:data.credit[19].date},
    {module:'invoices',id:data.invoices[19].id,text:'ثبت پرداخت صورت‌حساب',date:data.invoices[19].date},
    {module:'claims',id:data.claims[13].id,text:'به‌روزرسانی پرونده خسارت',date:data.claims[13].date}
  ];
  data.notificationsRead=false;
  return data;
}

function parseRoute() {
  const url=location.hash.slice(2);
  const [path,query='']=url.split('?');
  const parts=path.split('/');
  const innerRoles=parts[0]==='admins'&&parts[1]==='roles';
  const key=innerRoles?'roles':Object.hasOwn(modules,parts[0])?parts[0]:'dashboard';
  let id='';
  try { id=decodeURIComponent(parts[innerRoles?2:1]||''); } catch { id=''; }
  const params=new URLSearchParams(query);
  if(!id&&params.has('status')) {
    const state=key==='invoices'?(listStates[key]=makeState()):stateFor(key);
    const status=params.get('status');
    state.filters.status=key==='credit'&&status?creditCaseStatus(status):status;
    state.page=1;
  }
  return {key,id,installment:key==='invoices'&&id?Number(params.get('installment'))||0:0};
}

function chart() {
  const ranges=Array.from({length:chartPeriod},(_,i)=>8-chartPeriod+i+1);
  const values=ranges.map(month=>db.credit.filter(row=>row.date.startsWith(`1405/${pad(month)}/`)).length);
  const max=Math.max(4,Math.ceil(Math.max(...values)/4)*4);
  const x=i=>56+i*(514/(ranges.length-1));
  const y=value=>176-value*148/max;
  const points=values.map((v,i)=>[x(i),y(v)]);
  const line=points.map(([px,py])=>`${px},${py}`).join(' ');
  const grid=[0,1,2,3,4].map(i=>{
    const level=max*i/4;
    return `<line x1="51" x2="588" y1="${y(level)}" y2="${y(level)}" class="grid-line"/><text x="34" y="${y(level)+4}" text-anchor="end">${fa(level)}</text>`;
  }).join('');
  const description=ranges.map((month,i)=>`${monthNames[month-1]} ${fa(values[i])}`).join('، ');
  return `<div class="chart">
    <svg viewBox="0 0 615 218" dir="ltr" role="img" aria-label="تعداد پرونده‌ها؛ ${description}">
      <defs><linearGradient id="chart-fill" x1="0" x2="0" y1="0" y2="1" gradientUnits="objectBoundingBox">
        <stop offset="0" stop-color="#16a995" stop-opacity=".24"/><stop offset="1" stop-color="#16a995" stop-opacity=".035"/>
      </linearGradient></defs>
      ${grid}<polygon points="${x(0)},176 ${line} ${x(ranges.length-1)},176" fill="url(#chart-fill)"/>
      <polyline points="${line}" fill="none" stroke="#0d8c7e" stroke-width="2.6" stroke-linejoin="round"/>
      ${points.map(([px,py],i)=>`<circle class="plot-point" cx="${px}" cy="${py}" r="4.4"><title>${monthNames[ranges[i]-1]}، ${fa(values[i])} پرونده</title></circle>
        <text x="${px}" y="205" text-anchor="middle">${monthNames[ranges[i]-1]}</text>`).join('')}
    </svg></div>`;
}
function donut() {
  const colors={inquiry:'#597cc9',blocked:'#d7a23b',consumed:'#18a58d'};

function valueFor(key,row,prop) {
  if(key==='centers'){
    if(prop==='location') return [row.province,row.city].filter(Boolean).join(' / ');
    if(prop==='services') return db.services.filter(item=>item.centerId===row.id).length;
    if(prop==='branchCount') return row.branches?.length;
    if(prop==='centerInsurer') return row.insurers;
  }
  if(key==='plans'&&['timeCost','totalBenefit','tier'].includes(prop)&&isSettlementPlan(row)){
    return settlementResult(row.months,row.discountPoints)[prop];
  }
  if(key==='rankings'){
    const centerRecord=getRecord('centers',row.centerId);
    const latest=latestEvaluation(row);
    if(prop==='type'||prop==='city'||prop==='status') return centerRecord?.[prop];
    if(prop==='score') return evaluationScore(latest);
    if(prop==='count') return row.evaluations.length;
    if(prop==='date') return latest?.date;
    if(prop==='rank') return rankingOrder().findIndex(item=>item.id===row.id)+1;
  }
  if(key==='invoices'){
    const creditRecord=getRecord('credit',row.caseId);
    if(prop==='centerId'||prop==='userId') return creditRecord?.[prop];
    if(prop==='installmentProgress') return creditRecord?.installments;
    if(prop==='remaining') return row.total-row.paid;
    if(prop==='status') return row.paid===0?'unpaid':row.paid===row.total?'paid':'partial';
  }
  if(key==='credit'){
    if(prop==='national') return getRecord('users',row.userId)?.national;
    if(prop==='blockedAmount') return caseBlocked(row);
    if(prop==='disbursedAmount') return caseDisbursed(row);
  }
  if(key==='subscriptions'){
    if(prop==='used') return subscriptionCases(row.id).reduce((total,c)=>total+caseDisbursed(c),0);
    if(prop==='remaining') return row.limit-allocatedCredit(row.id);
  }
  if(key==='templates'&&prop==='rateSpread') return row.settlementRate-row.financingCost;
  if(key==='roles'){
    if(prop==='members') return db.admins.filter(admin=>admin.roleId===row.id).length;
    if(prop==='grantCount') return Object.values(row.permissions).reduce((total,actions)=>total+actions.length,0);
  }
  if(key==='users'){

function filteredInstallments(state,today=dateNow()) {
  const {filters={}}=state;
  const reference=normalize(state.query);
  const payer=normalize(state.payer);
  const rows=db.invoices.flatMap(invoice=>{
    if(reference&&![invoice.id,invoice.caseId].some(id=>normalize(id).includes(reference))) return [];
    const customer=getRecord('users',valueFor('invoices',invoice,'userId'));
    if(payer&&![customer?.name,customer?.national].some(value=>normalize(value).includes(payer))) return [];
    const centerId=valueFor('invoices',invoice,'centerId');
    if(filters.centerId&&centerId!==filters.centerId) return [];
    const schedule=scheduleFor(invoice);
    return schedule.flatMap(part=>{
      const dueStatus=installmentDueStatus(part,today);
      if((filters.status&&!matchesFilter(part.status,filters.status))||(filters.dueStatus&&filters.dueStatus!==dueStatus)) return [];
      if((state.from&&part.date<state.from)||(state.to&&part.date>state.to)) return [];
      return [{...part,invoice,customer,dueStatus,count:schedule.length}];
    });
  });
  return rows.sort((a,b)=>a.date.localeCompare(b.date)||a.invoice.id.localeCompare(b.invoice.id)||a.number-b.number);
}

function searchable(key,row) {
  const values=[row.id,titleFor(key,row)];
  if(key==='centers') {
    values.push(row.address,row.website,row.description);
    for(const branch of row.branches||[]) {
      values.push(branch.id,branch.code,branch.name,branch.address,branch.phoneNumber,...(branch.insurers||[]));
    }
  }
  let fields=columns[key];
  if(key==='plans'&&!isSettlementPlan(row)) fields=previousPlanColumns;
  if(key==='templates'){
    if(isCreditTemplate(row)) values.push(getRecord('paymentTiers',row.tierId)?.name);
    else fields=previousTemplateColumns;
  }
  for(const col of fields){
    const value=valueFor(key,row,col.key);
    if(col.format==='ref') {
      const related=getRecord(col.module,value);
      values.push(value,titleFor(col.module,related));
    } else if(col.format==='status') values.push(statusText(value));
    else if(col.format==='insurers') values.push(...(value||[]));
    else if(col.format==='percent') values.push((value/100).toFixed(2));
    else values.push(value);
  }
  return values.map(normalize);
}
function matchesFilter(actual,filter) {
  if(Array.isArray(actual)) return actual.includes(filter);
  if(filter==='outstanding') return ['unpaid','partial'].includes(actual);
  if(filter==='inProgress') return ['registered','inReview','needsDocs'].includes(actual);
  return actual===filter;
}
function filteredRows(key,state) {
  if(key==='invoices') return filteredInstallments(state);
  const dateFieldName=modules[key].date;
  const term=normalize(state.query);
  const rows=listRecords(key).filter(row=>{
    if(term&&!searchable(key,row).some(value=>value.includes(term))) return false;
    if(!Object.entries(state.filters).every(([prop,val])=>!val||matchesFilter(valueFor(key,row,prop),val))) return false;
    const date=dateFieldName?valueFor(key,row,dateFieldName):'';
    return (!state.from||date>=state.from)&&(!state.to||date<=state.to);
  });
  if(key==='rankings') return rows.sort((a,b)=>(valueFor(key,a,'rank')-valueFor(key,b,'rank'))*-state.direction);
  if(['credit','claims','users'].includes(key)) return newestFirst(rows);
  return rows;
}

      fa(part.number),dateText(part.date),currency(part.principal),currency(part.paid),currency(part.remaining),

    ]),'',true);

function installmentDetails(invoice) {
  if(route.key!=='invoices'||route.id!==invoice.id||!route.installment) return '';

  if(!part) return detailsPanel('قسط پیدا نشد',[named('شماره صورت‌حساب',invoice.id)],true);
  const payer=getRecord('users',valueFor('invoices',invoice,'userId'));
  return detailsPanel(`جزئیات قسط ${fa(part.number)} از ${fa(schedule.length)}`,[
    named('متعهد پرداخت',payer?.name),['کد ملی متعهد',showDigits(payer?.national)],dateRow('تاریخ سررسید',part.date),
    ['وضعیت سررسید',installmentDueBadge(installmentDueStatus(part,dateNow()))],['وضعیت قسط',badge(part.status)],
    amountRow('مبلغ قسط',part.principal),amountRow('مبلغ پرداخت‌شده',part.paid),amountRow('مانده قسط',part.remaining)
  ],true);
}

function detailView(key,id) {
  const row=getRecord(key,id);

  if(!row) {
    main.innerHTML=pageHead('رکورد پیدا نشد','فهرست ماژول را برای مشاهده رکوردهای موجود باز کنید.',back);
    return;
  }
  const actions=[back];
  if(canToggle(key,row)) actions.push(button(row.status==='active'?'غیرفعال‌کردن':'فعال‌کردن','toggle',{iconName:'power',module:key,id}));
  if(editable(key,row)) actions.push(button(key==='centers'?'ویرایش طرح قرارداد':'ویرایش','edit',{iconName:'edit',tone:'primary',module:key,id}));
  if(key==='rankings') actions.push(button('ثبت ارزیابی','create',{iconName:'plus',tone:'primary',module:key,id}));
  const transitions=creditTransitions(row.status);
  if(key==='credit'&&transitions.length) actions.push(button('تغییر وضعیت','credit-status',{module:key,id}));
  let title=titleFor(key,row);
  if(key==='plans'&&isSettlementPlan(row)) title=`طرح ${title} · ${titleFor('centers',getRecord('centers',row.centerId))}`;
  if(key==='invoices') title=`صورت‌حساب اقساط ${title}`;
  main.innerHTML=pageHead(title,`${modules[key].singular} · ${row.id}`,actions.join(''))+
    adminTabs(key)+`<div class="detail-grid">${detailContent(key,row)}</div>`;
}

function openDialog(title,body,{label='',submit=null,tone='primary',closeLabel='بستن'}={}) {
  closeMenu();
  if(!dialog.open) returnFocus=document.activeElement;
  const head=`<div class="dialog-head"><h2 id="dialog-title">${escapeHTML(title)}</h2>
    <button class="button row-action" type="button" data-action="close" aria-label="بستن پنجره">${icon('close')}</button></div>`;
  const content=`<div class="dialog-body">${body}</div><div class="dialog-foot">
    <button class="button" type="button" data-action="close">${closeLabel}</button>
    ${submit?`<button class="button ${tone}" type="submit">${escapeHTML(label)}</button>`:''}</div>`;
  dialog.innerHTML=head+(submit?`<form id="dialog-form" novalidate>${content}</form>`:content);
  if(submit) dialog.querySelector('form').addEventListener('submit',submit);
  if(!dialog.open) dialog.showModal();
  document.body.classList.add('modal-open');
  (dialog.querySelector('.dialog-body input:not([type=checkbox]), .dialog-body select, .dialog-body textarea')
    ||dialog.querySelector('button')).focus();
}
function closeDialog() {
  if(dialog.open) dialog.close();
}
dialog.addEventListener('close',()=>{
  document.body.classList.remove('modal-open');
  if(returnFocus?.isConnected) returnFocus.focus();
});
function dialogError(form,message,input=null) {
  const slot=form.querySelector('.form-error');
  slot.hidden=false;
  slot.textContent=message;
  if(input) {
    input.setAttribute('aria-invalid','true');
    input.focus();
    input.addEventListener('input',()=>input.removeAttribute('aria-invalid'),{once:true});
  }
}
function parseDate(input) {
  const match=latin(input).trim().match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})$/);
  if(!match) return null;
  const year=Number(match[1]),month=Number(match[2]),day=Number(match[3]);
  if(year<1200||year>1600||month<1||month>12||day<1) return null;
  const yearLength=month===12?persianYearLength(year):365;
  const maxDay=month<=6?31:month<12?30:yearLength-336;
  return day<=maxDay?`${year}/${pad(month)}/${pad(day)}`:null;
}
function persianYearLength(year) {
  const calendar=new Intl.DateTimeFormat('en', {calendar:'persian',timeZone:'UTC',year:'numeric',
    month:'numeric',day:'numeric',numberingSystem:'latn'});
  for(let day=18;day<=23;day++){
    const parts=Object.fromEntries(calendar.formatToParts(new Date(Date.UTC(year+622,2,day)))
      .map(part=>[part.type,Number(part.value)]));
    if(parts.year===year&&parts.month===12&&parts.day===30) return 366;
  }
  return 365;
}
function numeric(raw) {
  const cleaned=latin(raw).replace(/[٬,\s]/g,'').replace('٫','.');
  if(!/^\d+(?:\.\d+)?$/.test(cleaned)) return NaN;
  return Number(cleaned);
}
function parseLongId(value) {
  const digitsOnly=latin(value).trim();
  if(!/^\d{1,19}$/.test(digitsOnly)) return '';
  const id=BigInt(digitsOnly);
  return id>0n&&id<=9223372036854775807n?id.toString():'';
}
function safeWebUrl(value) {
  if(!value||value==='-'||/\s/.test(value)) return '';
  const explicitScheme=/^[a-z][a-z0-9+.-]*:/i.test(value);
  if(explicitScheme&&!/^https?:\/\//i.test(value)) return '';
  try {
    const url=new URL(explicitScheme?value:`https://${value}`);
    return url.hostname&&!url.username&&!url.password?url.href:'';
  } catch {
    return '';
  }
}
function fieldsFor(key,row=null) {

  } else if(type==='textarea'){
    control=`<textarea class="control" ${common} maxlength="${maxLength??360}">${escapeHTML(value)}</textarea>`;

    const mode=['number','coordinate'].includes(type)?'decimal':type==='phone'?'tel':type==='long'?'numeric':
      type==='website'?'url':'text';

      value="${escapeHTML(shown)}">`;

function collect(form,fields,inputs=form.elements) {
  const values={};
  for(const item of fields){
    if(typeof item==='string') continue;
    const input=inputs[item.key];
    const raw=input.value.trim();
    if(!raw) {
      if(item.required) {
        dialogError(form,`«${item.label}» را وارد کنید.`,input);
        return null;
      }
      values[item.key]='';
      continue;
    }
    let value=raw;
    let error='';
    if(item.type==='date'){
      value=parseDate(raw);
      if(!value) error='، تاریخ معتبر شمسی را به شکل سال/ماه/روز وارد کنید.';
    } else if(item.type==='phone'){
      value=latin(raw).replace(/[\s-]/g,'');
      if(!/^\d{8,15}$/.test(value)) error='، شماره‌ای بین ۸ و ۱۵ رقم وارد کنید.';
    } else if(item.type==='long'){
      value=parseLongId(raw);
      if(!value) error='، شناسه عددی معتبر وارد کنید.';
    } else if(item.type==='website'){
      value=raw==='-'?'':raw;
      if(value&&!safeWebUrl(value)) error='، یک نشانی معتبر وب‌سایت وارد کنید.';
    } else if(item.type==='coordinate'){
      const decimal=latin(raw).replace('٫','.').replace('−','-');
      value=/^[+-]?\d+(?:\.\d+)?$/.test(decimal)?Number(decimal):NaN;
      if(!Number.isFinite(value)||value<item.min||value>item.max) {
        error=`، عددی بین ${fa(item.min)} و ${fa(item.max)} وارد کنید.`;
      }
    } else if(item.type==='number'){
      value=numeric(raw);
      const validStep=item.step?Math.abs(value/item.step-Math.round(value/item.step))<0.00001:Number.isSafeInteger(value);
      if(!Number.isFinite(value)||!validStep||value<(item.min??0)||value>(item.max??1e12)) {
        const range=item.max!=null?`عددی بین ${fa(item.min??0)} و ${fa(item.max)}`:'مبلغ معتبر به ریال';
        error=`، ${range} وارد کنید.`;
      }
    } else if(item.options&&!item.options.some(option=>(Array.isArray(option)?option[0]:option)===value)) {
      error='، یک گزینه معتبر انتخاب کنید.';
    }
    if(error){
      dialogError(form,`برای «${item.label}»${error}`,input);
      return null;
    }
    values[item.key]=value;
  }
  return values;
}
function validate(key,values,row) {
  if(values.min>values.max) return {key:'max',message:'حداکثر مبلغ باید برابر یا بیشتر از حداقل مبلغ باشد.'};
  if(values.end&&values.end<values.start) return {key:'end',message:'تاریخ پایان باید برابر یا پس از تاریخ شروع باشد.'};
  if(key==='centers'&&values.companyId&&db.centers.some(center=>center.companyId===values.companyId&&center.id!==row?.id)){
    return {key:'companyId',message:'این شناسه برای مرکز دیگری ثبت شده است.'};
  }
  if(key==='plans'&&isSettlementPlan(values)&&listRecords('plans').some(plan=>plan.centerId===values.centerId&&plan.id!==row?.id)) {
    return {key:'centerId',message:'برای این مرکز قبلاً طرح پرداخت تعریف شده است.'};
  }
  if(key==='paymentTiers'){
    const others=db.paymentTiers.filter(tier=>tier.id!==row?.id);
    const name=normalize(values.name);
    if(name==='none'||name===normalize('بدون قرارداد')||name===normalize('بدون طرح')) {
      return {key:'name',message:'برای طرح یک نام متمایز انتخاب کنید.'};
    }
    if(others.some(tier=>normalize(tier.name)===name)) return {key:'name',message:'طرحی با این نام ثبت شده است.'};
    if(others.some(tier=>tier.threshold===values.threshold)) return {key:'threshold',message:'این حداقل امتیاز برای طرح دیگری ثبت شده است.'};
  }
  if(key==='credit'){
    if(values.requested>values.serviceAmount) return {key:'requested',message:'اعتبار درخواستی نباید از مبلغ خدمت بیشتر باشد.'};
  }
  if(key==='subscriptions'){
    if(values.ownerId===values.userId) return {key:'userId',message:'واگذارکننده و عضو خانواده باید دو نفر متفاوت باشند.'};
    if(values.limit<=0) return {key:'limit',message:'اعتبار واگذارشده باید بیشتر از صفر باشد.'};
    if(row&&values.limit<allocatedCredit(row.id)) {
      return {key:'limit',message:'مبلغ واگذاری نباید از مجموع اعتبار مسدودشده و مصرف‌شده کمتر باشد.'};
    }
    if(row&&values.userId!==row.userId&&subscriptionCases(row.id).length) {
      return {key:'userId',message:'این اشتراک به پرونده‌های عضو خانواده فعلی متصل است.'};
    }
  }
  if(key==='admins'&&db.admins.some(a=>a.id!==row?.id&&normalize(a.username)===normalize(values.username))) {
    return {key:'username',message:'این نام کاربری قبلاً ثبت شده است.'};
  }
  if(key==='roles'&&db.roles.some(a=>a.id!==row?.id&&normalize(a.name)===normalize(values.name))) {
    return {key:'name',message:'نقشی با این نام وجود دارد.'};
  }
  return null;
}

function saveForm(key,values,row) {
  let record=row;
  let message;
  if(key==='rankings') {
    record=db.rankings.find(r=>r.centerId===values.centerId);
    if(!record) {
      record={id:nextId(key),centerId:values.centerId,evaluations:[]};
      db.rankings.push(record);
    }
    const {centerId,...evaluation}=values;
    record.evaluations.push(evaluation);
    message='ارزیابی مرکز ثبت شد.';
  } else if(row) {
    if(key==='paymentTiers'&&row.name!==values.name) {
      for(const center of db.centers){
        for(const target of [center,...(center.branches||[])]){
          if(target.contractPlan===row.name) target.contractPlan=values.name;
        }
      }
      const plansFilter=stateFor('plans').filters;
      if(plansFilter.tier===row.name) plansFilter.tier=values.name;
    }
    if(key==='credit') {
      const changed=forms.credit.filter(field=>row[field.key]!==values[field.key]).map(field=>field.label);
      if(changed.length) row.changes.push(log(dateNow(),`ویرایش ${changed.join('، ')}`));
    }
    Object.assign(row,values);
    message='تغییرات ذخیره شد.';
  } else {
    record={id:nextId(key),date:dateNow(),...(key==='plans'?{status:'active'}:{}),...values};
    if(key==='templates') record.durations=times(12,index=>index+1);
    if(key==='centers'){
      const random=centerSampleRandom(record.id);
      const centerIds=new Set(db.centers.map(center=>center.companyId));
      const branchIds=new Set(db.centers.flatMap(center=>(center.branches||[]).map(branch=>branch.id)));
      for(const branch of record.branches||[]) if(branch.id) branchIds.add(branch.id);
      record.companyId||=sampleUniqueId(random,centerIds,50000000,99999999);
      record.personType||='حقیقی';
      for(const branch of record.branches||[]){
        branch.id||=sampleUniqueId(random,branchIds,6000000,9999999);
        branch.code||=branch.id;
      }
    }
    db[key].unshift(record);
    listStates[key]=makeState();
    message=`${modules[key].singular} ثبت شد.`;
  }
  activity(key,record,message);
  notifySaved(message);
  closeDialog();
  render();
  if(route.id) main.focus({preventScroll:true});
}

        if(!values) return;
        if(values.status==='blocked'){
          if(row.requested<=0) return dialogError(form,'برای مسدودسازی، مبلغ اعتبار درخواستی باید بیشتر از صفر باشد.');
          const subscription=getRecord('subscriptions',row.subscriptionId);
          if(subscription&&subscription.limit-allocatedCredit(subscription.id)<row.requested) {
            return dialogError(form,'اعتبار باقی‌مانده اشتراک برای این درخواست کافی نیست.');
          }
          row.approved=row.requested;
        }
        row.status=values.status;
        const date=dateNow();
        if(row.status==='consumed') recordDisbursement(row,date);
        const action=row.status==='consumed'?'ثبت مصرف اعتبار برای پرداخت به مرکز درمانی':'مسدودسازی اعتبار درخواستی';
        row.history.push(log(date,values.note||action,row.status));
        row.changes.push(log(date,action));
        activity('credit',row,`پرونده اعتباری ${statusText(row.status)}`);
        notifySaved('وضعیت پرونده به‌روز شد.');
        closeDialog();
        render();
      }
    });
}
function closeMenu() {
  if(!menuTrigger) return;
  menuTrigger.setAttribute('aria-expanded','false');
  document.querySelector('#row-menu')?.remove();
  menuTrigger=null;
}
function rowMenu(trigger) {
  const previous=menuTrigger;
  closeMenu();
  if(previous===trigger) return;
  const {module:key,id}=trigger.dataset;
  const row=getRecord(key,id);
  if(!row) return;
  const view=detailLink(key,row,'مشاهده جزئیات','');
  const items=[view.replace('>مشاهده جزئیات',`>${icon('eye')}مشاهده جزئیات`)];
  if(editable(key,row)) items.push(button(key==='centers'?'ویرایش طرح قرارداد':'ویرایش','edit',{module:key,id,iconName:'edit'}));
  if(canToggle(key,row)) items.push(button(row.status==='active'?'غیرفعال‌کردن':'فعال‌کردن','toggle',{module:key,id,iconName:'power'}));
  if(key==='rankings') items.push(button('ثبت ارزیابی','create',{module:key,id,iconName:'plus'}));
  if(key==='credit'&&creditTransitions(row.status).length) items.push(button('تغییر وضعیت','credit-status',{module:key,id,iconName:'edit'}));
  const menu=document.createElement('div');
  menu.className='row-menu';
  menu.id='row-menu';
  menu.innerHTML=items.join('');
  document.body.append(menu);
  const rect=trigger.getBoundingClientRect();
  menu.style.left=`${Math.max(8,Math.min(rect.right-menu.offsetWidth,innerWidth-menu.offsetWidth-8))}px`;
  menu.style.top=`${rect.bottom+menu.offsetHeight+10>innerHeight?Math.max(7,rect.top-menu.offsetHeight-4):rect.bottom+4}px`;
  menuTrigger=trigger;
  menuTrigger.setAttribute('aria-expanded','true');
  menu.querySelector('a').focus({preventScroll:true});
}
function showSearch() {
  openDialog('جست‌وجو در پنل',`<label class="search-field">${icon('search')}
      <input type="search" id="global-query" class="control" aria-label="نام، شماره پرونده یا شناسه" placeholder="نام، شماره پرونده یا شناسه"></label>
      <div id="global-results" class="search-results" aria-live="polite"><p>عنوان صفحه، نام یا شناسه رکورد را وارد کنید.</p></div>`);
}
function globalResults(value) {
  const container=dialog.querySelector('#global-results');
  if(!container) return;
  const query=normalize(value);
  if(!query) {
    container.innerHTML='<p>عنوان صفحه، نام یا شناسه رکورد را وارد کنید.</p>';
    return;
  }
  const hits=[];
  for(const [key,module] of Object.entries(modules)){
    const label=key==='roles'?'نقش‌ها و دسترسی‌ها':module.title;
    if(normalize(label).includes(query)) hits.push({url:pathname(key),label,type:'صفحه'});
    if(key==='dashboard') continue;
    for(const row of db[key]){
      if(searchable(key,row).some(text=>text.includes(query))){
        hits.push({url:pathname(key,row.id),label:titleFor(key,row),type:module.singular});
      }
    }
  }
  container.innerHTML=hits.length?hits.slice(0,16).map(({url,label,type})=>
    `<a href="${url}"><strong>${escapeHTML(label)}</strong><small>${type}</small></a>`).join(''):'<p>نتیجه‌ای پیدا نشد.</p>';
}
function showNotifications() {
  openDialog('اعلان‌ها',activities());
  db.notificationsRead=true;
  saveData();
  topbar.querySelector('.unread')?.remove();
}
function showProfile() {
  const profile=db.admins.find(row=>row.id===recordId('admins',0));
  if(!profile) return;
  const role=getRecord('roles',profile.roleId);
  openDialog('حساب مدیر',`<div class="profile-summary"><span class="avatar">${escapeHTML(profile.name.charAt(0))}</span>
    <div><strong>${escapeHTML(profile.name)}</strong><p>${escapeHTML(role?.name||'—')}</p></div></div>
    ${detailLink('admins',profile,'مشاهده حساب مدیریتی')}`);
}
function showDocument(id,index) {
  const row=getRecord('claims',id);
  const name=row?.documents[index];
  if(!name) return;
  openDialog(name,`<article class="panel mock-doc">${tile('file')}<h3>${escapeHTML(name)}</h3>
    <p>شناسه مرجع <bdi>${escapeHTML(row.id)}-D${index+1}</bdi></p>
    <p>پرونده خسارت ${detailLink('claims',row)}</p><p>بیمه‌شده ${detailLink('users',getRecord('users',row.userId))}</p>
    <p>تاریخ ثبت ${dateText(row.date)}</p>${index===0?`<p>مبلغ درخواستی ${amountText(row.requested)}</p>`:
       `<p>نوع خدمت ${escapeHTML(row.type)}</p>`}
    <small>سند نمایشی پرونده</small></article>`);
}
function readDateRange(fields) {
  const values={};
  for(const [key,input] of Object.entries(fields)){
    values[key]=input.value.trim()?parseDate(input.value):'';
    if(values[key]===null) {
      toast('تاریخ شمسی معتبر به شکل سال/ماه/روز وارد کنید.');
      input.focus();
      return null;
    }
  }
  if(values.from&&values.to&&values.from>values.to) {
    toast('تاریخ پایان باید پس از تاریخ شروع یا برابر با آن باشد.');
    fields.to.focus();
    return null;
  }
  return values;
}
function applyDates() {
  const fields=Object.fromEntries([...document.querySelectorAll('[data-date-filter]')].map(input=>[input.dataset.dateFilter,input]));
  const values=readDateRange(fields);
  if(!values) return;
  Object.assign(stateFor(route.key),values,{page:1});
  Object.entries(values).forEach(([key,v])=>{fields[key].value=digits(v);});
  renderRows(route.key);
}
function applyInstallmentFilters(form) {
  const {from,to,reference,payer,status,dueStatus,centerId}=form.elements;
  const range=readDateRange({from,to});
  if(!range) return;
  Object.assign(stateFor('invoices'),range,{
    page:1,query:reference.value,payer:payer.value,
    filters:{status:status.value,dueStatus:dueStatus.value,centerId:centerId.value}
  });
  from.value=digits(range.from);
  to.value=digits(range.to);
  renderRows('invoices');
}
function go() {
  closeDialog();
  syncNav();
  route=parseRoute();
  render(true);
  window.scrollTo(0,0);
  main.focus({preventScroll:true});
}
window.addEventListener('hashchange',go);
document.addEventListener('click',event=>{
  const anchor=event.target.closest('a[href^="#/"]');
  if(anchor) {
    closeMenu();
    if(dialog.open&&dialog.contains(anchor)) closeDialog();
    if(anchor.hash===location.hash) {
      event.preventDefault();
      go();
    }
    return;
  }
  const trigger=event.target.closest('[data-action]');
  if(!trigger) { closeMenu(); return; }
  const {action,module:key,id}=trigger.dataset;
  if(action!=='row-menu') closeMenu();
  switch(action){
    case 'skip':main.focus();break;
    case 'sidebar':syncNav(!document.body.classList.contains('nav-open'));break;
    case 'close':closeDialog();break;
    case 'global-search':showSearch();break;
    case 'notifications':showNotifications();break;
    case 'profile':showProfile();break;
    case 'document':showDocument(id,Number(trigger.dataset.index));break;
    case 'row-menu':rowMenu(trigger);break;
    case 'create':formView(key,id);break;
    case 'edit':formView(key,id,true);break;
    case 'expand-table-group': {
      const groupId=trigger.getAttribute('aria-controls');
      const group=document.getElementById(groupId);
      if(!group) break;
      const opening=group.hidden;
      if(opening) openTableGroups.add(groupId);
      else openTableGroups.delete(groupId);
      group.hidden=!opening;
      trigger.setAttribute('aria-expanded',String(opening));
      break;
    }
    case 'edit-branch':editCenterContract(id,Number(trigger.dataset.branch));break;
    case 'toggle-branch':confirmToggle('centers',id,Number(trigger.dataset.branch));break;
    case 'add-center-unit': {
      const fields=dialog.querySelector('#center-unit-fields');
      fields.insertAdjacentHTML('beforeend',centerUnitFields());
      fields.lastElementChild.querySelector('input').focus();
      break;
    }
    case 'remove-center-unit': {
      trigger.closest('[data-center-unit]').remove();
      dialog.querySelector('[data-action="add-center-unit"]').focus();
      break;
    }
    case 'toggle':confirmToggle(key,id);break;
    case 'credit-status':changeCreditStatus(id);break;
    case 'reset-filters':listStates[route.key]=makeState();listView(route.key);document.querySelector('#list-search')?.focus();break;
    case 'apply-dates':applyDates();break;
    case 'page':stateFor(route.key).page=Number(trigger.dataset.page);renderRows(route.key);break;
    case 'sort':stateFor(route.key).direction*=-1;stateFor(route.key).page=1;renderRows(route.key);
      document.querySelector('[data-action="sort"]')?.focus();break;
  }
});
document.addEventListener('input',event=>{
  if(event.target.id==='list-search'&&route.key!=='invoices') {
    Object.assign(stateFor(route.key),{query:event.target.value,page:1});
    renderRows(route.key);
  }
  if(event.target.id==='global-query') globalResults(event.target.value);
  if(event.target.name==='months'||event.target.name==='discountPoints') updateSettlementPreview();
});
document.addEventListener('submit',event=>{
  if(event.target.id!=='installment-filters') return;
  event.preventDefault();
  applyInstallmentFilters(event.target);
});
document.addEventListener('change',event=>{
  const field=event.target.dataset.filter;
  if(field){
    const state=stateFor(route.key);
    state.filters[field]=event.target.value;
    state.page=1;
    renderRows(route.key);
  }
  if(event.target.id==='chart-period'){
    chartPeriod=Number(event.target.value);
    document.querySelector('#chart-content').innerHTML=chart();
  }
});
document.addEventListener('keydown',event=>{
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){
    event.preventDefault();
    showSearch();
  }
  if(event.key==='Escape'&&menuTrigger){
    const trigger=menuTrigger;
    closeMenu();
    trigger.focus();
  }
  if(event.key==='Escape'&&document.body.classList.contains('nav-open')){
    syncNav();
    topbar.querySelector('.menu-toggle')?.focus();
  }
  if(event.key==='Enter'&&route.key!=='invoices'&&event.target.matches('[data-date-filter]')) applyDates();
});
document.addEventListener('scroll',closeMenu,true);
window.addEventListener('resize',closeMenu);
go();

</script>
</body>
</html>
